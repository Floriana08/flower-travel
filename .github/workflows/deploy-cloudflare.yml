name: Deploy to Cloudflare

# Manual only until the Cloudflare token/deploy path is confirmed green.
# This stops GitHub from emailing on every push to main while the job fails.
# Re-enable push triggers after a successful manual run.
on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing or empty."
            echo "GitHub → Settings → Secrets and variables → Actions → New repository secret"
            echo "Name must be exactly: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is present."

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 83ee682c25e1f0316a8c016de3a237dd
          CI: true
          WRANGLER_SEND_METRICS: "false"
