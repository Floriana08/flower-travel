name: Deploy to Cloudflare

# Manual only until a green deploy is confirmed, then we can re-enable:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi

          CODE=$(curl -s -o /tmp/cf-verify.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            || true)

          echo "Cloudflare token verify HTTP status: $CODE"
          cat /tmp/cf-verify.json || true
          echo

          if [ "$CODE" != "200" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN was rejected by Cloudflare."
            echo "Create a new token: https://dash.cloudflare.com/profile/api-tokens"
            echo "Use template: Edit Cloudflare Workers"
            echo "Then update GitHub secret CLOUDFLARE_API_TOKEN (paste once, no extra spaces)."
            exit 1
          fi

          echo "Cloudflare API token verified."

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 83ee682c25e1f0316a8c016de3a237dd
          CI: true
          WRANGLER_SEND_METRICS: "false"
